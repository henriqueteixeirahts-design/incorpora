services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: incorpora
      POSTGRES_PASSWORD: incorpora
      POSTGRES_DB: incorpora
    ports:
      - "5434:5432"
    volumes:
      - incorpora_db_data:/var/lib/postgresql/data

volumes:
  incorpora_db_data:
