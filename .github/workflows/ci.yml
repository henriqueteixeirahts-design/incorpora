name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: incorpora
          POSTGRES_PASSWORD: incorpora
          POSTGRES_DB: incorpora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incorpora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # RLS Pilar 2, Etapa 2.5/3 — DATABASE_URL (o que a aplicação e os
      # testes usam de verdade, via src/lib/prisma.ts) conecta como
      # `app_user`, NUNCA como a role superusuária do serviço Postgres do
      # CI (`incorpora`, criada superusuário pela imagem oficial — ignora
      # RLS incondicionalmente). Sem isso, os futuros testes de bypass de
      # RLS (Etapa 4+) dariam falso-verde no CI pelo mesmo motivo que
      # dariam localmente/produção sem essa mesma correção (já aplicada
      # nesses dois ambientes). DIRECT_URL continua em `incorpora` — só
      # `prisma migrate deploy` e o script de senha abaixo usam essa
      # credencial, nunca os testes.
      DATABASE_URL: "postgresql://app_user:app_user_ci_pw@localhost:5432/incorpora?schema=public"
      DIRECT_URL: "postgresql://incorpora:incorpora@localhost:5432/incorpora?schema=public"
      NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
      SUPABASE_SERVICE_ROLE_KEY: "placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testes de unidade
        run: npm test

      - name: Aplicar migrations no Postgres de teste (como incorpora, via DIRECT_URL — cria app_user, grants e statement_timeout, tudo já versionado nas migrations da Etapa 2.5/3)
        run: npx prisma migrate deploy

      - name: Habilitar login pra app_user (a migration cria ela NOLOGIN de propósito — senha real nunca fica versionada)
        run: node scripts/ci-set-app-user-password.js

      - name: Testes de integração (isolamento entre organizações, CRUD, regras — como app_user, sem BYPASSRLS)
        run: npm run test:integration

      - name: Build
        run: npm run build
