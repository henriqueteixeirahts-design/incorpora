name: CI

on:
  push:
    # `sprint-**`: desde 2026-11-09 o desenvolvimento roda na nuvem em
    # branches de sprint, e a staging foi aposentada — o CI é onde as
    # migrations são replayadas e as travas provadas. Rodar o CI no push
    # desses branches não tem efeito colateral (banco efêmero do próprio
    # job, sem deploy; previews da Vercel estão desligados).
    branches: [master, "sprint-**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Imagem do Supabase (mesma versão da produção, incorpora-cl: Postgres
      # 17.6.1.147) no lugar do `postgres:17` puro — desde 2026-11-09. Motivo:
      # no postgres puro as roles anon/authenticated/service_role não
      # existiam, então as travas "nenhuma role do PostgREST consegue X"
      # (tests/integration/*-function.test.ts, no-public-schema-access-*)
      # passavam VAZIAS, e o watchdog do pg_cron era pulado pela guarda da
      # migration. Aqui o banco nasce como o da produção: `postgres` sem
      # superusuário (só BYPASSRLS), roles do Supabase com os default
      # privileges do Supabase, pg_cron disponível. A staging
      # (incorpora-staging-rls) está pausada — este é o ambiente de replay.
      #
      # Banco `postgres` (não um banco `incorpora`): o pg_cron da imagem só
      # aceita CREATE EXTENSION no banco de `cron.database_name` = postgres,
      # igual à produção.
      postgres:
        image: supabase/postgres:17.6.1.147
        env:
          POSTGRES_PASSWORD: incorpora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      # Pooler em modo transação (pré-requisito da Etapa 4, aprovado em
      # 2026-11-09): a produção conecta pelo Supavisor em modo transação
      # (porta 6543), onde a conexão física é reaproveitada a cada transação
      # e um SET de sessão escorrega entre clientes. O CI não tem o
      # Supavisor; o PgBouncer em modo transação é a mesma classe de pooling.
      # Pool de 2 conexões físicas, de propósito: força o reuso entre
      # organizações que scripts/prove-pooler-tenant-context.ts exige (sem
      # reuso, a prova é inconclusiva e falha).
      pgbouncer:
        image: edoburu/pgbouncer:v1.26.1-p0
        env:
          DATABASE_URL: "postgres://app_user:app_user_ci_pw@postgres:5432/postgres"
          POOL_MODE: transaction
          DEFAULT_POOL_SIZE: "2"
          MAX_CLIENT_CONN: "100"
          AUTH_TYPE: scram-sha-256
        ports:
          - 6432:5432
    env:
      # RLS Pilar 2, Etapa 2.5/3 — DATABASE_URL (o que a aplicação e os
      # testes usam de verdade, via src/lib/prisma.ts) conecta como
      # `app_user` (sem superusuário, sem BYPASSRLS). DIRECT_URL conecta
      # como `postgres` — a mesma role que aplica migrations na produção
      # (sem superusuário na imagem do Supabase; BYPASSRLS sim) — usada só
      # por `prisma migrate deploy`, pelo script de senha e pelos testes que
      # precisam da role de migration (checagem de default privileges,
      # mutações das travas), nunca pela aplicação.
      DATABASE_URL: "postgresql://app_user:app_user_ci_pw@localhost:5432/postgres?schema=public"
      DIRECT_URL: "postgresql://postgres:incorpora@localhost:5432/postgres?schema=public"
      # Com a imagem do Supabase, as 3 roles do PostgREST são obrigatórias:
      # as travas falham (em vez de passar vazias) se alguma faltar.
      # Ver tests/integration/helpers/supabase-roles.ts.
      EXPECT_SUPABASE_ROLES: "1"
      NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
      SUPABASE_SERVICE_ROLE_KEY: "placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testes de unidade
        run: npm test

      - name: Aplicar migrations no Postgres de teste (como postgres, via DIRECT_URL — cria app_user, grants, statement_timeout e o watchdog do pg_cron, tudo já versionado nas migrations)
        run: npx prisma migrate deploy

      - name: Habilitar login pra app_user (a migration cria ela NOLOGIN de propósito — senha real nunca fica versionada)
        run: node scripts/ci-set-app-user-password.js

      - name: Testes de integração (isolamento entre organizações, CRUD, regras — como app_user, sem BYPASSRLS)
        # --reporter=verbose: nome e resultado de cada teste no log do CI (prova
        # por escrito dos controles e mutações da V3/V6, não só "N tests" por arquivo).
        run: npm run test:integration -- --reporter=verbose

      # Prova do pooler: contexto de organização (SET LOCAL via a extensão de
      # src/lib/prisma.ts) visível em toda a transação, sem vazamento entre
      # clientes, policy de RLS filtrando (tabela temporária) — com reuso de
      # conexão física comprovado e o controle negativo (SET de sessão vaza)
      # obrigatório. Contra a produção, o mesmo script roda pelo Supavisor.
      - name: Prova do pooler (PgBouncer em modo transação — contexto de organização não vaza)
        env:
          DATABASE_URL: "postgresql://app_user:app_user_ci_pw@localhost:6432/postgres"
          POOLER_PROOF_PORT: "6432"
          POOLER_PROOF_REQUIRE_LEAK_DETECTION: "1"
        run: npx tsx scripts/prove-pooler-tenant-context.ts

      - name: Build
        run: npm run build

      # Prova por escrito do oráculo (ressalva aberta desde 2026-10): roda de
      # novo, isoladas e com o nome de cada teste no log, as mutações da V3
      # (motor de multa/mora/dias) e da V6a (histórico de cálculo), contra o
      # banco deste job — cada arquivo com o seu controle sem mutação, que
      # precisa dar OK. Fica no fim do log de propósito (fácil de achar).
      - name: Oráculo — mutações da V3 e da V6a (controle sem mutação precisa dar OK)
        run: npx vitest run --config vitest.integration.config.ts --reporter=verbose tests/integration/audit-v3-mutation.test.ts tests/integration/audit-v6-history.test.ts

  # RLS Etapa 4 (2026-11-10) — a Etapa 4 INTEIRA provada no CI antes de
  # produção ver qualquer policy: mesma imagem do Supabase, banco descartável,
  # os 17 grupos de prisma/rls-etapa4/ aplicados (84 tabelas), e a suíte
  # completa rodando com RLS LIGADO — mais a fronteira tabela por tabela
  # (tests/integration/rls-fronteira.test.ts), a reversão de cada grupo, a
  # prova do pooler e o oráculo. Nada daqui toca produção.
  test-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.6.1.147
        env:
          POSTGRES_PASSWORD: incorpora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      pgbouncer:
        image: edoburu/pgbouncer:v1.26.1-p0
        env:
          DATABASE_URL: "postgres://app_user:app_user_ci_pw@postgres:5432/postgres"
          POOL_MODE: transaction
          DEFAULT_POOL_SIZE: "2"
          MAX_CLIENT_CONN: "100"
          AUTH_TYPE: scram-sha-256
        ports:
          - 6432:5432
    env:
      DATABASE_URL: "postgresql://app_user:app_user_ci_pw@localhost:5432/postgres?schema=public"
      DIRECT_URL: "postgresql://postgres:incorpora@localhost:5432/postgres?schema=public"
      EXPECT_SUPABASE_ROLES: "1"
      # Liga os testes que só fazem sentido com as policies aplicadas.
      RLS_ETAPA4_ENABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
      SUPABASE_SERVICE_ROLE_KEY: "placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - name: SQLs do RLS conferem com o inventário e o schema (gerador)
        run: node scripts/rls-generate-policies.mjs --check

      - name: Aplicar migrations (como postgres)
        run: npx prisma migrate deploy

      - name: Habilitar login pra app_user
        run: node scripts/ci-set-app-user-password.js

      - name: Ativar o RLS — grupo 00 + grupos 1 a 17 (84 tabelas)
        run: node scripts/rls-apply-etapa4.mjs

      - name: Testes de integração com RLS LIGADO (suíte completa + fronteira das 84 tabelas + reversão)
        run: npm run test:integration -- --reporter=verbose

      - name: Prova do pooler com RLS ligado (PgBouncer em modo transação)
        env:
          DATABASE_URL: "postgresql://app_user:app_user_ci_pw@localhost:6432/postgres"
          POOLER_PROOF_PORT: "6432"
          POOLER_PROOF_REQUIRE_LEAK_DETECTION: "1"
        run: npx tsx scripts/prove-pooler-tenant-context.ts

      - name: Oráculo com RLS ligado — mutações da V3 e da V6a
        run: npx vitest run --config vitest.integration.config.ts --reporter=verbose tests/integration/audit-v3-mutation.test.ts tests/integration/audit-v6-history.test.ts
