name: CI

on:
  push:
    # `sprint-**`: desde 2026-11-09 o desenvolvimento roda na nuvem em
    # branches de sprint, e a staging foi aposentada — o CI é onde as
    # migrations são replayadas e as travas provadas. Rodar o CI no push
    # desses branches não tem efeito colateral (banco efêmero do próprio
    # job, sem deploy; previews da Vercel estão desligados).
    branches: [master, "sprint-**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Imagem do Supabase (mesma versão da produção, incorpora-cl: Postgres
      # 17.6.1.147) no lugar do `postgres:17` puro — desde 2026-11-09. Motivo:
      # no postgres puro as roles anon/authenticated/service_role não
      # existiam, então as travas "nenhuma role do PostgREST consegue X"
      # (tests/integration/*-function.test.ts, no-public-schema-access-*)
      # passavam VAZIAS, e o watchdog do pg_cron era pulado pela guarda da
      # migration. Aqui o banco nasce como o da produção: `postgres` sem
      # superusuário (só BYPASSRLS), roles do Supabase com os default
      # privileges do Supabase, pg_cron disponível. A staging
      # (incorpora-staging-rls) está pausada — este é o ambiente de replay.
      #
      # Banco `postgres` (não um banco `incorpora`): o pg_cron da imagem só
      # aceita CREATE EXTENSION no banco de `cron.database_name` = postgres,
      # igual à produção.
      postgres:
        image: supabase/postgres:17.6.1.147
        env:
          POSTGRES_PASSWORD: incorpora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # RLS Pilar 2, Etapa 2.5/3 — DATABASE_URL (o que a aplicação e os
      # testes usam de verdade, via src/lib/prisma.ts) conecta como
      # `app_user` (sem superusuário, sem BYPASSRLS). DIRECT_URL conecta
      # como `postgres` — a mesma role que aplica migrations na produção
      # (sem superusuário na imagem do Supabase; BYPASSRLS sim) — usada só
      # por `prisma migrate deploy`, pelo script de senha e pelos testes que
      # precisam da role de migration (checagem de default privileges,
      # mutações das travas), nunca pela aplicação.
      DATABASE_URL: "postgresql://app_user:app_user_ci_pw@localhost:5432/postgres?schema=public"
      DIRECT_URL: "postgresql://postgres:incorpora@localhost:5432/postgres?schema=public"
      # Com a imagem do Supabase, as 3 roles do PostgREST são obrigatórias:
      # as travas falham (em vez de passar vazias) se alguma faltar.
      # Ver tests/integration/helpers/supabase-roles.ts.
      EXPECT_SUPABASE_ROLES: "1"
      NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
      SUPABASE_SERVICE_ROLE_KEY: "placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testes de unidade
        run: npm test

      - name: Aplicar migrations no Postgres de teste (como postgres, via DIRECT_URL — cria app_user, grants, statement_timeout e o watchdog do pg_cron, tudo já versionado nas migrations)
        run: npx prisma migrate deploy

      - name: Habilitar login pra app_user (a migration cria ela NOLOGIN de propósito — senha real nunca fica versionada)
        run: node scripts/ci-set-app-user-password.js

      - name: Testes de integração (isolamento entre organizações, CRUD, regras — como app_user, sem BYPASSRLS)
        run: npm run test:integration

      - name: Build
        run: npm run build
