name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: incorpora
          POSTGRES_PASSWORD: incorpora
          POSTGRES_DB: incorpora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incorpora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Testes de unidade/build não tocam banco de verdade. Testes de
      # integração usam o serviço Postgres acima (schema aplicado via
      # `prisma migrate deploy` antes de rodar).
      DATABASE_URL: "postgresql://incorpora:incorpora@localhost:5432/incorpora?schema=public"
      DIRECT_URL: "postgresql://incorpora:incorpora@localhost:5432/incorpora?schema=public"
      NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
      SUPABASE_SERVICE_ROLE_KEY: "placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testes de unidade
        run: npm test

      - name: Aplicar migrations no Postgres de teste
        run: npx prisma migrate deploy

      - name: Testes de integração (isolamento entre organizações, CRUD, regras)
        run: npm run test:integration

      - name: Build
        run: npm run build
